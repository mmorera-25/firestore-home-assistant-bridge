name: Firestore HA Bridge
version: 0.1.12
slug: firestore_ha_bridge
description: Outbound Firestore listener for remote Home Assistant lighting (no public HA URL on clients)
url: https://github.com/mmorera-25/firestore-home-assistant-bridge
arch:
  - aarch64
  - armv7
  - amd64
startup: application
boot: auto
init: false
hassio_api: true
options:
  org_id: ""
  setup_id: ""
  edge_base_url: ""
  ha_base_url: "http://homeassistant:8123"
  ha_access_token: ""
  firebase_api_key: ""
  firebase_project_id: ""
  poll_interval_seconds: 10
  state_interval_seconds: 60
  heartbeat_interval_seconds: 60
schema:
  org_id: password
  setup_id: password
  device_id: password?
  edge_base_url: url
  pairing_code: password?
  ha_base_url: url
  ha_access_token: password
  firebase_api_key: password
  firebase_project_id: str
  # Wide ranges accept legacy saved options (e.g. poll=2, state=15); Python clamps to safe mins.
  poll_interval_seconds: int(1,300)?
  state_interval_seconds: int(1,300)?
  heartbeat_interval_seconds: int(1,300)?
map:
  - data
